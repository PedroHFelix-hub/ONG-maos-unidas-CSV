<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cadastre-se como voluntário ou doador da ONG Mãos Unidas.">
  <title>ONG Mãos Unidas | Cadastro</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topo">
    <h1>ONG Mãos Unidas</h1>
    <nav aria-label="Menu principal">
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="projetos.html">Projetos</a></li>
        <li><a href="cadastro.html" aria-current="page">Cadastro</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="cadastro">
      <h2>Faça seu cadastro</h2>
      <p>Campos marcados com * são obrigatórios.</p>

      <form action="#" method="post" class="formulario">
        <fieldset>
          <legend>Dados pessoais</legend>

          <label for="nome">Nome completo *</label>
          <input type="text" id="nome" name="nome" required minlength="5" maxlength="100"
                 autocomplete="name">

          <label for="cpf">CPF *</label>
          <input type="text" id="cpf" name="cpf" required
                 pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" maxlength="14" inputmode="numeric"
                 placeholder="000.000.000-00" title="Digite o CPF no formato 000.000.000-00">

          <label for="email">E-mail *</label>
          <input type="email" id="email" name="email" required autocomplete="email"
                 placeholder="nome@exemplo.com">

          <label for="telefone">Telefone *</label>
          <input type="tel" id="telefone" name="telefone" required
                 pattern="\(\d{2}\) \d{4,5}-\d{4}" maxlength="15" autocomplete="tel"
                 placeholder="(11) 99999-9999" title="Digite o telefone no formato (00) 00000-0000">

          <label for="nascimento">Data de nascimento *</label>
          <input type="date" id="nascimento" name="nascimento" required max="2026-09-16">
        </fieldset>

        <fieldset>
          <legend>Endereço</legend>

          <label for="cep">CEP *</label>
          <input type="text" id="cep" name="cep" required
                 pattern="\d{5}-\d{3}" maxlength="9" inputmode="numeric"
                 placeholder="00000-000" title="Digite o CEP no formato 00000-000">

          <label for="logradouro">Logradouro *</label>
          <input type="text" id="logradouro" name="logradouro" required autocomplete="address-line1">

          <label for="numero">Número *</label>
          <input type="number" id="numero" name="numero" required min="0">

          <label for="complemento">Complemento</label>
          <input type="text" id="complemento" name="complemento" autocomplete="address-line2">

          <label for="cidade">Cidade *</label>
          <input type="text" id="cidade" name="cidade" required autocomplete="address-level2">

          <label for="estado">Estado *</label>
          <select id="estado" name="estado" required>
            <option value="">Selecione</option>
            <option value="AC">AC</option>
            <option value="AL">AL</option>
            <option value="AP">AP</option>
            <option value="AM">AM</option>
            <option value="BA">BA</option>
            <option value="CE">CE</option>
            <option value="DF">DF</option>
            <option value="ES">ES</option>
            <option value="GO">GO</option>
            <option value="MA">MA</option>
            <option value="MT">MT</option>
            <option value="MS">MS</option>
            <option value="MG">MG</option>
            <option value="PA">PA</option>
            <option value="PB">PB</option>
            <option value="PR">PR</option>
            <option value="PE">PE</option>
            <option value="PI">PI</option>
            <option value="RJ">RJ</option>
            <option value="RN">RN</option>
            <option value="RS">RS</option>
            <option value="RO">RO</option>
            <option value="RR">RR</option>
            <option value="SC">SC</option>
            <option value="SP">SP</option>
            <option value="SE">SE</option>
            <option value="TO">TO</option>
          </select>
        </fieldset>

        <fieldset>
          <legend>Área de interesse *</legend>

          <div class="opcao">
            <input type="radio" id="voluntario" name="interesse" value="voluntario" required>
            <label for="voluntario">Quero ser voluntário</label>
          </div>
          <div class="opcao">
            <input type="radio" id="doador" name="interesse" value="doador">
            <label for="doador">Quero fazer doações</label>
          </div>
        </fieldset>

        <button type="submit">Enviar cadastro</button>
      </form>
    </section>
  </main>

  <footer class="rodape">
    <p>&copy; 2026 ONG Mãos Unidas. Todos os direitos reservados.</p>
    <p>
      <a href="https://www.instagram.com/">Instagram</a> |
      <a href="https://www.facebook.com/">Facebook</a>
    </p>
  </footer>
</body>
</html>
